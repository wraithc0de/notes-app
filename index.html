<!DOCTYPE html>
<html class="theme-dark lo-nl lo-tt">
    <head>
        <title>Notes</title>
        <link rel="icon" href="/assets/favicon.ico">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="/css/main.css">
        <link rel="stylesheet" href="/css/themes.css">
        <link rel="stylesheet" href="/css/mobile.css">
        <link rel="stylesheet" href="/css/tooltips.css">
    </head>
    <body>
        <div id="ctxmenu">
            <div id="ctx-listitem">
                <button>
                    <span><i class="ti ti-pencil"></i> Rename</span>
                    <i>F2</i>
                </button>
            </div>
        </div>

        <header>
            <button>File</button>
            <button>Tools</button>
            <button>Settings</button>
        </header>

        <div id="midsect">
            <nav>
                <header>
                    <span>Manager</span>
                    <div class="spacer"></div>
                    <button id="navsearchbtn" class="tt-b-m" data-tooltip="Search your notes"><i class="ti ti-search"></i></button>
                    <button id="lockednotesbtn" class="tt-b-m" data-tooltip="Locked Notes"><i class="ti ti-lock"></i></button>
                </header>
                <section>
                    <header>
                        <i class="ti ti-chevron-right expanded-indic"></i>
                        <span>Recent</span>
                    </header>
                    <div id="recentitems" class="itemlist">
                        <span class="no-notes">Nothing to display.</span>
                    </div>
                </section>
                <section>
                    <header>
                        <i class="ti ti-chevron-right expanded-indic"></i>
                        <span>All Notes</span>
                    </header>
                    <div id="allnotes" class="itemlist">
                        <div class="item pinned unsaved">
                            <span>File Name</span>
                            <div class="spacer"></div>
                            <i class="ti ti-pin pinned-indic"></i>
                        </div>
                        <div class="item">
                            <span>File Name</span>
                            <div class="spacer"></div>
                            <i class="ti ti-pin pinned-indic"></i>
                        </div>
                        <span class="no-notes">Nothing to display.</span>
                    </div>
                </section>
            </nav>

            <div id="navresize"></div>

            <main>
                <section id="formatting">
                    <button class="tt-b-m" data-tooltip="Bold"><i class="ti ti-bold"></i></button>
                    <button class="tt-b-m" data-tooltip="Italic"><i class="ti ti-italic"></i></button>
                    <button class="tt-b-m" data-tooltip="Underline"><i class="ti ti-underline"></i></button>
                    <button class="tt-b-m" data-tooltip="Strikethrough"><i class="ti ti-strikethrough"></i></button>
                    <button class="tt-b-m" data-tooltip="Highlight"><i class="ti ti-highlight"></i></button>
                </section>

                <section id="workspace">
                    <textarea id="textarea">Main editing area
                    </textarea>
                </section>

                <section id="findandreplace">
                    <div>
                        <div>
                            <div class="cinput">
                                <input placeholder="Find...">
                                <button class="tt-t-m" data-tooltip="Case-sensitive toggle"><i class="ti ti-letter-case"></i></button>
                            </div>
                        </div>
                        <div>
                            <div class="cinput">
                                <input placeholder="Replace...">
                                <button class="tt-t-m" data-tooltip="Preserve case"><i class="ti ti-arrow-big-up-line"></i></button>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div>
                            <span>No results</span>
                        </div>
                        <div>
                            <button class="tt-t-m" data-tooltip="Replace current"><i class="ti ti-a-b-2"></i></button>
                            <button class="tt-t-m" data-tooltip="Replace all instances"><i class="ti ti-replace"></i></button>
                        </div>
                    </div>
                    <div>
                        <div>
                            <button class="tt-t-m" data-tooltip="Previous"><i class="ti ti-chevron-up"></i></button>
                            <button class="tt-t-m" data-tooltip="Next"><i class="ti ti-chevron-down"></i></button>
                            <button class="tt-t-r" data-tooltip="Exit F&R"><i class="ti ti-x"></i></button>
                        </div>
                        <div>
                            <!-- empty cell for easier styling -->
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <footer class="display-autosaving">
            <span>Currently Editing: &nbsp; "<span id="ft-currentediting">File Name</span>"</span>
            <div class="spacer"></div>
            <span id="saving-text"><i class="ti ti-device-floppy"></i> &nbsp; Saving...</span>
            <span id="autosaving-text"><i class="ti ti-robot"></i> &nbsp; Autosaving...</span>
            <div class="spacer"></div>
            <span>&copy; <script>document.write(new Date().getFullYear());</script> wraithcode. All rights reserved.</span>
        </footer>

        <script src="/js/helpers.js"></script>
        <script src="/js/main.js"></script>
        <script src="/js/nav.js"></script>
    </body>
</html>
